name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run script tests
        run: python3 -m unittest tests.test_scripts

      - name: Check skill package
        run: python3 tests/validate_skill.py cache-cop

      - name: Compile Python syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [*Path('cache-cop/scripts').glob('*.py'), *Path('tests').glob('*.py')]:
              compile(path.read_text(), str(path), 'exec')
              print(f'ok {path}')
          PY

      - name: Check whitespace (pull_request)
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check whitespace (push)
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          zero="0000000000000000000000000000000000000000"
          if [ -z "$before" ] || [ "$before" = "$zero" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git diff-tree --check --no-commit-id --root -r HEAD
          else
            git diff --check "${before}...HEAD"
          fi

      - name: Ensure generated bytecode is absent
        run: |
          generated="$(find . \( -name __pycache__ -o -name '*.pyc' \) -print)"
          if [ -n "$generated" ]; then
            echo "$generated"
            exit 1
          fi
